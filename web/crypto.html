<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131311" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<title>Charles Crypto</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/viz.js"></script>
<style>
/* crypto page only */
:root { --btc: #eda100; --eth: #4a3aa7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --btc: #c98500; --eth: #9085e9; } }
:root[data-theme="dark"] { --btc: #c98500; --eth: #9085e9; }
.coin { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--border); }
.ci { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 500; color: #fff; font-size: 14px; flex: none; }
.coin .ci { grid-row: span 2; }
.coin .line { grid-column: 2 / -1; }
.trend { position: relative; height: 5px; border-radius: 3px; background: var(--surface-2); margin: 8px 0 4px; }
.trend .mid { position: absolute; left: 50%; top: -3px; width: 1px; height: 11px; background: var(--text-2); }
.trend i { position: absolute; top: 0; height: 100%; border-radius: 3px; }
.tag.hold { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-ink); }
.tag.cash { background: var(--surface-2); color: var(--text-2); }
details.act-d { border-top: 1px solid var(--border); }
details.act-d summary { list-style: none; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 9px 0; font-size: 14px; font-weight: 400; color: var(--text); margin: 0; min-height: 0; }
details.act-d summary::-webkit-details-marker { display: none; }
details.act-d p { margin: 0 0 9px 46px; font-size: 13px; color: var(--text-2); }
.pm-btc { background: #9a6500; min-height: 150px; }
.pm-eth { background: #4a3aa7; min-height: 150px; }
.pm-cash { background: #3a3931; min-height: 150px; }
.planmap.coins { grid-template-columns: var(--btc-share, 60fr) var(--eth-share, 40fr); }
</style>
</head>
<body class="loading">
<header></header>
<main>
  <div class="seg" id="seg" role="group" aria-label="Crypto sections"></div>

  <section class="view on" id="v-home">
   <div class="feed-page">
    <div class="feed-main">
      <div class="card ink">
        <div class="hero-head"><div class="eyebrow">Crypto earned so far</div><span class="chip practice" title="Paper book: no real dollars move">Practice money</span></div>
        <div class="big num" id="value">$0.00</div>
        <div class="sub num" id="ret">&nbsp;</div>
        <div class="chart hero-chart" id="chart"></div>
        <div class="chart-foot"><div class="tabs" id="range" role="group" aria-label="Time range"></div><div class="legend"><span class="key" id="key-bot"></span><span class="key" id="key-btc"></span></div></div>
        <div class="hero-acts"><a class="btn small primary" href="/leaderboard?bot=crypto">Try someone else's settings</a><button class="btn small" type="button" id="go-plan">Change settings</button></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>What it holds</h2><span class="aside" id="next-check"></span></div>
        <div class="alloc" id="alloc-now" role="img"></div>
        <div class="alloc-keys" id="alloc-keys"></div>
        <div id="coins"></div>
      </div>
    </div>
    <aside class="card feed-col" id="feed" data-bot="crypto" aria-label="Feed"></aside>
   </div>
  </section>

  <section class="view" id="v-plan">
    <div class="tab-stack">
      <div class="card ink">
        <div class="hero-head"><div class="eyebrow">The plan right now</div><span class="chip practice" id="plan-mode" hidden></span></div>
        <div class="ink-title" id="plan-title"></div>
        <div class="planmap coins" id="planmap"></div>
        <div class="plan-next" id="plan-next"></div>
      </div>
      <div class="two even tune-row">
        <div class="card tune" id="tune" data-bot="crypto"></div>
        <div class="card tune-copy" id="tune-copy" hidden></div>
      </div>
      <div class="two even" id="dials">
        <div class="card dial-card" id="dial-BTC-USD"></div>
        <div class="card dial-card" id="dial-ETH-USD"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>This plan since 2016</h2><span class="aside">Simulated, $1,000 start</span></div>
        <div class="bt-big num" id="bt-big" style="--n:2"></div>
        <div class="chart" id="bt-chart"></div>
        <div class="years" id="bt-years"></div>
        <div class="caveat" id="bt-caveat"></div>
      </div>
    </div>
  </section>

</main>

<script>
"use strict";
const TABS = [["home", "Overview"], ["plan", "Plan"]];
const RANGES = [["1D", 1], ["1W", 7], ["1M", 30], ["All", 1e5]];      // crypto trades around the clock, like Kalshi
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = (v, d = 2) => v == null ? "—" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgnUsd = v => v == null ? "—" : (v > 0 ? "+" : "") + usd(v);
/* A big number shrinks to fit its box instead of overflowing it: long totals and small phones. */
function fitText(el) {
  if (!el) return;
  el.style.fontSize = "";
  const k = el.clientWidth / el.scrollWidth;
  if (el.clientWidth && k < 1) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * k * .99).toFixed(1) + "px";
}
const pct = (v, d = 2) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
const cls = v => v == null ? "" : v > 0.004 ? "up" : v < -0.004 ? "down" : "flat";
const arrow = v => v == null ? "" : v > 0.004 ? "▲ " : v < -0.004 ? "▼ " : "";
const ago = iso => { if (!iso) return "—"; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 129600 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const dayFmt = (iso, o = {weekday: "short", month: "short", day: "numeric"}) => new Date(iso.length === 10 ? iso + "T12:00:00" : iso).toLocaleDateString("en-US", o);
const COLOR = {"BTC-USD": "--btc", "ETH-USD": "--eth"}, LETTER = {"BTC-USD": "₿", "ETH-USD": "Ξ"};
const BT = [["plan", "--series-1", false, "Charles crypto"], ["btc", "--ref", true, "Just hold bitcoin"]];
const TWO_TONE = `<svg width="18" height="6"><line x1="1" x2="9" y1="3" y2="3" stroke="var(--good)" stroke-width="2.4" stroke-linecap="round"/><line x1="9" x2="17" y1="3" y2="3" stroke="var(--critical)" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el, to, fmt) {
  if (REDUCED || el.dataset.counted) { el.textContent = fmt(to); return; }
  el.dataset.counted = 1;
  const from = to * 0.985, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let S = null, tab = "home", range = "All", chartShown = false;
try { range = localStorage.getItem("crypto-range") || range; } catch (e) {}
// Always opens on Overview, with nothing remembered (owner 2026-10-31). A link can ask for a tab once: /stocks#plan.
const asked = location.hash.slice(1);
if (asked) { tab = asked; history.replaceState(null, "", location.pathname + location.search); }

function keySvg(color, dashed) {
  return `<svg width="18" height="6"><line x1="1" x2="17" y1="3" y2="3" stroke="var(${color})" stroke-width="2" stroke-linecap="round"${dashed ? ' stroke-dasharray="4 3"' : ""}/></svg>`;
}
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function hover(box, n, X, dots, tipHtml, idxAt) {
  const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), cross = box.querySelector("#cross");
  const W = box.clientWidth; let cur = -1;
  const show = i => {
    cur = Math.max(0, Math.min(n - 1, i)); const xi = X(cur);
    cross.setAttribute("x1", xi); cross.setAttribute("x2", xi); cross.setAttribute("opacity", .5);
    for (const d of dots(cur).filter(Boolean)) { const el = box.querySelector(d[1]); if (el) { el.setAttribute("cx", xi); el.setAttribute("cy", d[0]); el.setAttribute("opacity", 1); } }
    tip.innerHTML = tipHtml(cur); tip.style.display = "block";
    const tw = tip.offsetWidth; tip.style.left = (xi + 12 + tw > W ? Math.max(0, xi - tw - 12) : xi + 12) + "px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("opacity", 0); box.querySelectorAll("circle").forEach(c => c.setAttribute("opacity", 0)); };
  const at = ev => { const r = svg.getBoundingClientRect(); show(idxAt(ev.clientX - r.left)); };
  svg.onpointermove = at; svg.onpointerdown = at; svg.onpointerleave = hide; svg.onblur = hide;
  svg.onpointerup = ev => { if (ev.pointerType !== "mouse") setTimeout(hide, 1500); };
  svg.onkeydown = ev => { if (ev.key === "ArrowLeft") { show(cur < 0 ? n - 1 : cur - 1); ev.preventDefault(); }
    if (ev.key === "ArrowRight") { show(cur < 0 ? 0 : cur + 1); ev.preventDefault(); } };
}

/* tabs */
function buildTabs() {
  $("seg").innerHTML = TABS.map(([k, l]) => `<button type="button" data-t="${k}">${l}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => setTab(b.dataset.t));
  if (!RANGES.some(r => r[0] === range)) range = "All";
  $("range").innerHTML = RANGES.map(([k]) => `<button type="button" data-r="${k}">${k}</button>`).join("");
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { range = b.dataset.r; try { localStorage.setItem("crypto-range", range); } catch (e) {} renderChart(); });
  $("key-bot").innerHTML = TWO_TONE + "Charles";
  $("key-btc").innerHTML = keySvg("--ref", true) + "Bitcoin";
  $("go-plan").onclick = () => setTab("plan");
  setTab(tab);
}
function setTab(t) {
  tab = TABS.some(x => x[0] === t) ? t : "home";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + tab));
  document.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  window.scrollTo(0, 0);
  if (S && tab === "home") renderChart();
  if (S && tab === "plan") renderBacktest();
}

/* the live chart: the paper book vs bitcoin from the same start; shorter ranges zoom in. It always starts at
   the book's first point: a range longer than the history is greyed out until there's enough of it. */
function series() {
  const b = S.book, curve = b.curve;
  const days = RANGES.find(r => r[0] === shownRange())[1];
  const cut = days >= 1e5 ? "" : new Date(+new Date(curve.at(-1)[0]) - days * 864e5).toISOString();
  let from = curve.findIndex(p => p[0] >= cut);
  if (from < 0 || curve.length - from < 2) from = Math.max(0, curve.length - 2);
  const pts = curve.slice(from);
  const btc = (S.btc_hourly || []).map(([t, v]) => [+new Date(t), v]), start = (b.start_prices || {})["BTC-USD"];
  const live = b.coins.find(c => c.product === "BTC-USD");
  const btcAt = (t, last) => { if (last && live && live.price) return live.price; let c = start; for (const [ts, v] of btc) { if (ts <= t) c = v; else break; } return c; };
  const btcVals = start ? pts.map((p, i) => b.start_cash * btcAt(+new Date(p[0]), from + i === curve.length - 1) / start) : null;
  return {pts, btcVals};
}
const histDays = () => { const c = S && S.book && S.book.curve; return c && c.length > 1 ? (new Date(c.at(-1)[0]) - new Date(c[0][0])) / 864e5 : 0; };
const shownRange = () => { const d = RANGES.find(r => r[0] === range)[1]; return d < 1e5 && histDays() < d ? "All" : range; };
function renderChart() {
  const hd = histDays();
  document.querySelectorAll("[data-r]").forEach(b => { const d = RANGES.find(r => r[0] === b.dataset.r)[1], off = d < 1e5 && hd < d;
    b.disabled = off; b.title = off ? `Turns on once the demo has run ${d === 1 ? "a day" : d === 7 ? "a week" : "a month"}` : "";
    b.classList.toggle("on", b.dataset.r === shownRange()); });
  const box = $("chart"), b = S && S.book;
  if (!b || b.curve.length < 2) { box.innerHTML = `<div class="empty">The chart starts after the first check.</div>`; return; }
  if (!box.clientWidth) return;
  const {pts, btcVals} = series(), raw = pts.map(p => p[1]), n = pts.length, base = b.start_cash;
  const vals = raw.map(v => v - base), btcs = btcVals ? btcVals.map(v => v - base) : null;
  const W = box.clientWidth, H = box.clientHeight, m = {l: 54, r: 10, t: 14, b: 24};
  const all = vals.concat(btcs || [], 0);
  let lo = Math.min(...all), hi = Math.max(...all);
  const padv = Math.max((hi - lo) * 0.12, 1); lo -= padv; hi += padv;
  const t0 = +new Date(pts[0][0]), t1 = +new Date(pts.at(-1)[0]), tspan = Math.max(1, t1 - t0);
  const X = i => m.l + (+new Date(pts[i][0]) - t0) * (W - m.l - m.r) / tspan;
  const nearest = x => { const t = t0 + x * tspan; let k = 0; for (let i = 0; i < n; i++) if (Math.abs(+new Date(pts[i][0]) - t) < Math.abs(+new Date(pts[k][0]) - t)) k = i; return k; };
  const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const line = arr => arr.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join("");
  const fmtX = d => d.toLocaleString("en-US", tspan < 2 * 864e5 ? {hour: "numeric"} : {month: "short", day: "numeric"});
  const money0 = v => (v > 0 ? "+$" : v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-US", {maximumFractionDigits: v % 1 ? 2 : 0});
  let grid = "";
  for (const v of niceTicks(lo, hi, 5)) if (v) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>` +
    `<text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${money0(v)}</text>`;
  grid += `<text x="${m.l - 8}" y="${Y(0) + 4}" text-anchor="end">$0</text>`;
  const nt = Math.max(1, Math.min(5, Math.floor((W - m.l - m.r) / 100)));
  for (let k = 0; k <= nt; k++) { const x = m.l + k * (W - m.l - m.r) / nt;
    grid += `<text x="${x}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === nt ? "end" : "middle"}">${fmtX(new Date(t0 + k * tspan / nt))}</text>`; }
  const y0 = Y(0), cut = (y0 / H * 100).toFixed(2) + "%", first = !chartShown;
  chartShown = true;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="What the crypto book has earned vs bitcoin. Arrow keys read values.">
    <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="${H}"><stop offset="${cut}" stop-color="var(--good)"/><stop offset="${cut}" stop-color="var(--critical)"/></linearGradient></defs>
    <g class="axis">${grid}</g>
    <line x1="${m.l}" x2="${W - m.r}" y1="${y0}" y2="${y0}" stroke="var(--ref)" stroke-width="1"/>
    <g${first ? ' class="plot-in"' : ""}><path d="${line(vals)}L${X(n - 1)},${y0}L${X(0)},${y0}Z" fill="url(#g)" style="opacity:var(--chart-fill, .17)"/>
    ${btcs ? `<path d="${line(btcs)}" fill="none" stroke="var(--ref)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>` : ""}
    <path d="${line(vals)}" fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></g>
    <line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-2)" stroke-width="1" opacity="0"/>
    ${btcs ? `<circle id="sdot" r="4.5" fill="var(--ref)" stroke="var(--surface)" stroke-width="2" opacity="0"/>` : ""}
    <circle id="cdot" r="4.5" fill="var(--text)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
  </svg><div class="tip"></div>`;
  hover(box, n, X, i => [[Y(vals[i]), "#cdot"], btcs && [Y(btcs[i]), "#sdot"]],
    i => `<div class="t">${new Date(pts[i][0]).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"})}</div>
      <div class="r">${TWO_TONE}<span>Charles crypto</span><b class="num ${cls(vals[i])}">${sgnUsd(vals[i])}</b></div>
      ${btcs ? `<div class="r">${keySvg("--ref", true)}<span>Bitcoin, same start</span><b class="num">${sgnUsd(btcs[i])}</b></div>` : ""}`,
    x => nearest((x - m.l) / (W - m.l - m.r)));
}

/* the simulation on the Plan tab: log scale, so a 50% drop looks the same in 2018 and 2022 */
function renderBacktest() {
  const B = S && S.backtest, box = $("bt-chart");
  if (!B) { box.innerHTML = `<div class="empty">No simulation file yet.</div>`; return; }
  const base = B.runs.plan.curve, n = base.length;
  if (!box.clientWidth || n < 2) return;
  const W = box.clientWidth, H = box.clientHeight, m = {l: 54, r: 10, t: 10, b: 24};
  const all = BT.flatMap(([k]) => B.runs[k].curve.map(p => p[1]));
  const lo = Math.log(Math.min(...all) * 0.9), hi = Math.log(Math.max(...all) * 1.08);
  const X = i => m.l + i * (W - m.l - m.r) / (n - 1), Y = v => m.t + (hi - Math.log(v)) / (hi - lo) * (H - m.t - m.b);
  const ticks = [1000, 10000, 100000, 1000000].filter(v => Math.log(v) > lo && Math.log(v) < hi);
  let grid = ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">$${v >= 1e6 ? v / 1e6 + "M" : v / 1000 + "k"}</text>`).join("");
  let lastX = -99;                       // a year that starts in December would print on top of the next one
  for (const y of [...new Set(base.map(p => p[0].slice(0, 4)))]) { const x = X(Math.max(0, base.findIndex(p => p[0].startsWith(y))));
    if (x - lastX >= 40) { grid += `<text x="${x}" y="${H - 6}" text-anchor="middle">${y}</text>`; lastX = x; } }
  const paths = BT.map(([k, c, d]) => `<path d="${B.runs[k].curve.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("")}" fill="none" stroke="var(${c})" stroke-width="${k === "plan" ? 2.2 : 1.6}"${d ? ' stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Simulated growth of $1,000 since 2016: the crypto plan vs holding bitcoin"><g class="axis">${grid}</g>${paths}
    <line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-2)" stroke-width="1" opacity="0"/>
    ${BT.map(([k, c], j) => `<circle id="bd${j}" r="4" fill="var(${c})" stroke="var(--surface)" stroke-width="2" opacity="0"/>`).join("")}</svg><div class="tip"></div>`;
  hover(box, n, X, i => BT.map(([k], j) => [Y(B.runs[k].curve[Math.min(i, B.runs[k].curve.length - 1)][1]), "#bd" + j]),
    i => `<div class="t">${dayFmt(base[i][0], {month: "short", year: "numeric"})}</div>` + BT.map(([k, c, d, l]) =>
      `<div class="r">${keySvg(c, d)}<span>${l}</span><b class="num">${usd(B.runs[k].curve[Math.min(i, B.runs[k].curve.length - 1)][1], 0)}</b></div>`).join(""),
    x => Math.round((x - m.l) / (W - m.l - m.r) * (n - 1)));
  $("bt-big").innerHTML = BT.map(([k, c, d, l]) => { const r = B.runs[k].all; return `<div class="bt-run"><span class="bt-l"><span class="sw" style="background:var(${c})"></span>${l}</span><b class="${cls(r.cagr_pct)}">${pct(r.cagr_pct, 0)}</b><span class="bt-s">a year · worst drop <span class="down">${pct(r.max_drawdown_pct, 0)}</span></span></div>`; }).join("");
  const yearly = {}; let prev = base[0][1];              // the plan's curve, one return a year
  for (let i = 0; i < n; i++) { const y = base[i][0].slice(0, 4); if (i === n - 1 || base[i + 1][0].slice(0, 4) !== y) { yearly[y] = (base[i][1] / prev - 1) * 100; prev = base[i][1]; } }
  $("bt-years").innerHTML = yearBars(yearly, "Year by year", pct);
  const p21 = B.runs.plan.since_2021, b21 = B.runs.btc.since_2021;
  $("bt-caveat").innerHTML = `Simulated on past Coinbase prices, not real results. Since mid-2021 the plan made <b>less</b> than just holding bitcoin (${pct(p21.cagr_pct, 0)} a year vs ${pct(b21.cagr_pct, 0)}), with about half the worst drop (${pct(p21.max_drawdown_pct, 0)} vs ${pct(b21.max_drawdown_pct, 0)}). <details style="margin-top:4px"><summary>Read this with care</summary>The simulation charges a ${B.fee_pct}% fee per trade. Crypto's early boom flatters any plan that owned coins then. Only money you could watch fall by half belongs here.</details>`;
}

/* The Plan tab's picture: the money as blocks, a dial per coin */
function renderPlan(b) {
  const st = S.settings, w = st.WEIGHTS, coins = b ? b.coins : [];
  const out = coins.filter(c => !c.holding), held = coins.filter(c => c.holding);
  $("plan-mode").hidden = !b;
  $("plan-mode").textContent = !out.length ? "Holding both" : !held.length ? "All in cash" : `Holding ${held[0].name.toLowerCase()}`;
  const shares = `${Math.round(w["BTC-USD"] * 100)}% bitcoin, ${Math.round(w["ETH-USD"] * 100)}% ether`;
  $("plan-title").textContent = !b ? "It starts at the first check." : !held.length ? "All in cash until a trend turns up." : !out.length ? `${shares}.` : `${held[0].name} now, ${out[0].name.toLowerCase()}'s share in cash.`;
  $("planmap").style.setProperty("--btc-share", w["BTC-USD"] * 100 + "fr");
  $("planmap").style.setProperty("--eth-share", w["ETH-USD"] * 100 + "fr");
  $("planmap").innerHTML = coins.map(c => { const pc = Math.round(w[c.product] * 100), coin = c.product === "BTC-USD" ? "pm-btc" : "pm-eth";
    return `<div class="pm ${c.holding ? coin : "pm-cash"}"><b class="num">${pc}%</b><span>${c.holding ? esc(c.name) : "Cash"}</span><small>${c.holding ? `${usd(c.value, 0)} now` : `${esc(c.name)} waits under its average`}</small></div>`; }).join("");
  $("plan-next").innerHTML = [["Checks", "Weekly"], ["Next check", b && b.next_check ? dayFmt(b.next_check, {month: "short", day: "numeric"}) : "—"], ["Fee per trade", (st.FEE * 100).toFixed(1) + "%"]]
    .map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
  $("dials").hidden = !coins.length;
  for (const c of coins) { const g = c.gap_pct;
    $("dial-" + c.product).innerHTML = `<div class="card-head"><h2>${esc(c.name)}</h2><span class="aside">${c.holding ? "Holding" : "In cash"}</span></div>` +
      dial({min: -40, max: 40, value: g, zones: [[-40, 0, "var(--critical)"], [0, 40, "var(--good)"]], big: g == null ? "—" : pct(g, 1), tone: cls(g),
        sub: `Price vs its ${st.TREND_DAYS}-day average. Under the line at a weekly check, its share moves to cash.`}); }
}

function render() {
  const b = S.book;
  document.body.classList.remove("loading");
  if (!b) {
    $("value").textContent = "$0.00";
    $("ret").textContent = "The practice book starts at its first check.";
    $("coins").innerHTML = `<div class="empty">No check yet.</div>`;
    renderPlan(null);
    if (tab === "plan") renderBacktest();
    return;
  }
  renderPlan(b);
  $("value").className = "big num " + cls(b.return);
  $("value").textContent = sgnUsd(b.return);
  fitText($("value"));
  countUp($("value"), b.return, sgnUsd);
  const beat = b.btc_pct == null ? null : b.return_pct - b.btc_pct;
  $("ret").innerHTML = `<b class="${cls(b.day_change)}">${sgnUsd(b.day_change)}</b> today · ${usd(b.value)} in all` +
    (beat == null ? "" : ` · <b class="${cls(beat)}">${beat >= 0 ? "ahead of" : "behind"} bitcoin by ${Math.abs(beat).toFixed(2)} pts</b>`);
  $("next-check").textContent = b.next_check ? `Next check ${dayFmt(b.next_check, {month: "short", day: "numeric"})}` : "";
  const parts = b.coins.map(c => [c.name, c.value, COLOR[c.product]]).concat([["Cash", b.cash, "--cash"]]);
  $("alloc-now").innerHTML = parts.filter(r => r[1] > 0).map(([l, v, c]) => `<i style="width:${v / b.value * 100}%;background:var(${c})" title="${esc(l)} ${(v / b.value * 100).toFixed(0)}%"></i>`).join("");
  $("alloc-now").setAttribute("aria-label", parts.map(([l, v]) => `${l} ${(v / b.value * 100).toFixed(0)}%`).join(", "));
  $("alloc-keys").innerHTML = parts.map(([l, v, c]) => `<span><span class="sw" style="background:var(${c})"></span>${esc(l)} <b class="num" style="font-weight:500">${(v / b.value * 100).toFixed(0)}%</b></span>`).join("");
  $("coins").innerHTML = b.coins.map(c => {
    const g = c.gap_pct, w = g == null ? 0 : Math.min(50, Math.abs(g) * 1.5);
    const bar = g == null ? "" : `<i style="${g >= 0 ? "left:50%" : "right:50%"};width:${w}%;background:var(${g >= 0 ? "--good" : "--critical"})"></i>`;
    return `<div class="coin"><span class="ci" style="background:var(${COLOR[c.product]})">${LETTER[c.product] || ""}</span>
      <div style="min-width:0"><span class="sym">${esc(c.name)}</span><span class="tag ${c.holding ? "hold" : "cash"}">${c.holding ? "Holding" : "In cash"}</span></div>
      <div class="right"><b class="num" style="font-weight:500">${usd(c.value)}</b>${c.holding && c.gain != null ? ` <span class="small num ${cls(c.gain)}">${sgnUsd(c.gain)}</span>` : ""}</div>
      <div class="line"><div class="trend"><span class="mid"></span>${bar}</div>
        <div class="small muted num"><span class="${cls(g)}">${g == null ? "No average yet" : pct(g, 1)}</span>${g == null ? "" : " vs its 200-day average"} · price ${usd(c.price, c.price < 100 ? 2 : 0)}</div></div></div>`;
  }).join("");
  // what's coming
  if (tab === "home") renderChart();
  if (tab === "plan") renderBacktest();
}

async function load() {
  try {
    const r = await fetch("api/state", {cache: "no-store"});
    S = await r.json();
    render();
  } catch (e) { document.body.classList.remove("loading"); }
}

buildTabs();
addEventListener("resize", () => { if (S) { fitText($("value")); renderChart(); renderBacktest(); } });
load();
setInterval(load, 30000);
</script>
<script src="/tune.js"></script>
</body>
</html>
